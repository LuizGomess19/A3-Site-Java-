# ============================================
# WALNUT BREWERY — Configurações do Spring Boot
# ============================================

# Nome do aplicativo
spring.application.name=walnut-brewery

# Portas do servidor
server.port=8080

# --------------------------------------------
# CONFIGURAÇÕES DO BANCO DE DADOS H2
# --------------------------------------------
# Salvaremos o banco em um arquivo local no projeto (./db/walnutdb) para os dados persistirem entre execuções
spring.datasource.url=jdbc:h2:file:./db/walnutdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar o console web do H2 para visualização (acesso em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Desativar a proteção de frame-options para permitir a exibição do console H2
spring.headers.frame-options.disable=true
spring.security.headers.frame.options.disable=true

# --------------------------------------------
# CONFIGURAÇÕES DO JPA / HIBERNATE
# --------------------------------------------
# Cria e atualiza as tabelas automaticamente de acordo com as classes Java @Entity
spring.jpa.hibernate.ddl-auto=update
# Exibe as queries SQL executadas no console para fins de desenvolvimento/correção
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --------------------------------------------
# LOGS
# --------------------------------------------
# Exibir apenas logs informativos relevantes no console
logging.level.org.springframework=INFO
logging.level.com.walnut.brewery=DEBUG
